<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunelle Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:#f4eee5; --surface:#fffdfa; --soft:#f7f1e8;
    --ink:#2c2c2c; --muted:#6b635c; --faint:#a39a8f; --line:rgba(23,19,19,.1);
    --side:#221e1b; --side-ink:#e8e0d2; --side-dim:#a99f90;
    --accent:#9f3f55; --accent-soft:#f6e7eb; --teal:#0f766e; --teal-soft:#e3efed;
    --err:#b3413d; --warn:#a1770a; --info:#4a5f8a; --dark:#24201e;
    --display:"Cormorant Garamond",Georgia,"Songti SC",serif;
    --body:"Inter","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(50,42,36,.05), 0 16px 44px -22px rgba(50,42,36,.3);
    --shadow-up:0 3px 6px rgba(50,42,36,.06), 0 24px 56px -22px rgba(50,42,36,.38);
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font:500 14px/1.6 var(--body); }

  /* ---------- app shell ---------- */
  aside { position:fixed; inset:0 auto 0 0; width:230px; background:var(--side);
          color:var(--side-ink); display:flex; flex-direction:column;
          padding:30px 16px 22px; z-index:10; }
  .brand { padding:0 12px 26px; }
  .brand .wm { font-family:var(--display); font-size:26px; font-weight:600;
               color:#f4ede1; line-height:1; }
  .brand .sub { font-size:10px; font-weight:600; letter-spacing:.28em;
                color:#d98aa0; margin-top:7px; }
  nav { display:flex; flex-direction:column; gap:3px; }
  nav a { display:flex; align-items:center; gap:10px; padding:10px 14px;
          border-radius:11px; color:var(--side-dim); text-decoration:none;
          font-size:13.5px; font-weight:600; transition:background .15s, color .15s; }
  nav a:hover { color:var(--side-ink); background:rgba(255,255,255,.05); }
  nav a.on { color:#fff; background:rgba(159,63,85,.4); }
  nav a .k { font-family:var(--display); font-size:17px; width:16px; text-align:center;
             font-style:italic; opacity:.85; }
  .side-foot { margin-top:auto; padding:14px 12px 0; border-top:1px solid rgba(255,255,255,.08);
               font-size:12px; color:var(--side-dim); }
  .side-foot b { color:var(--side-ink); font-weight:600; }

  .content { margin-left:230px; padding:44px 48px 100px; max-width:1280px; }

  /* ---------- view chrome ---------- */
  .view { display:none; }
  .view.on { display:block; animation:fadein .25s ease-out; }
  @keyframes fadein { from { opacity:0; transform:translateY(5px); } }
  @media (prefers-reduced-motion:reduce){ .view.on { animation:none; } }
  .vhead { display:flex; align-items:flex-end; gap:18px; margin-bottom:26px; }
  .vhead h1 { font-family:var(--display); font-size:34px; font-weight:600;
              margin:0; line-height:1.1; }
  .vhead .n { font-family:var(--display); font-style:italic; font-size:19px;
              color:var(--faint); }
  .vhead .sp { flex:1; }
  .vsub { color:var(--muted); font-size:13.5px; margin:-18px 0 26px; }

  /* ---------- controls ---------- */
  button { font:600 13.5px var(--body); cursor:pointer; border-radius:999px;
           padding:9px 22px; min-height:40px; border:1.5px solid var(--ink);
           background:transparent; color:var(--ink); display:inline-flex;
           align-items:center; justify-content:center;
           transition:all .15s; }
  button:hover { background:var(--ink); color:#fff8ef; }
  button.primary { background:var(--dark); border-color:var(--dark); color:#fffdfb;
                   box-shadow:0 10px 24px -10px rgba(36,32,30,.5); }
  button.primary:hover { background:#000; transform:translateY(-1px); }
  button.quiet { border-color:var(--line); color:var(--muted); }
  button.quiet:hover { background:var(--soft); color:var(--ink); }
  button.link { border:none; background:none; min-height:0; padding:5px 12px;
                color:var(--accent); }
  button.link:hover { background:var(--accent-soft); color:var(--accent); }
  button.sm { min-height:32px; padding:5px 14px; font-size:12.5px; }
  button:disabled { opacity:.45; cursor:default; }

  label { display:block; font-size:12.5px; font-weight:600; color:var(--muted);
          margin:13px 0 5px; }
  input, textarea, select { width:100%; padding:10px 14px; border:1px solid var(--line);
    border-radius:13px; font:500 14px var(--body); background:var(--surface);
    color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(159,63,85,.09); }
  textarea { resize:vertical; min-height:84px; line-height:1.55; }
  ::placeholder { color:#b6ada2; font-weight:400; }

  /* ---------- library ---------- */
  .metrics { display:flex; gap:26px; margin-bottom:28px; }
  .metrics div { font-size:13px; color:var(--muted); }
  .metrics b { font-family:var(--display); font-size:22px; font-weight:600;
               color:var(--ink); margin-right:5px; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; }
  .card { background:var(--surface); border-radius:18px; overflow:hidden;
          box-shadow:var(--shadow); transition:box-shadow .2s, transform .2s;
          border:1px solid rgba(23,19,19,.05); }
  .card:hover { box-shadow:var(--shadow-up); transform:translateY(-2px); }
  .thumb { aspect-ratio:4/3; background:var(--soft); display:flex; align-items:center;
           justify-content:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ph { font-family:var(--display); font-style:italic; font-size:38px;
               color:#d9cfc0; }
  .card .cb { padding:15px 18px 16px; }
  .card h3 { font-family:var(--display); font-size:19px; font-weight:600; margin:0; }
  .card .sku { font-family:var(--mono); font-size:11px; color:var(--faint);
               font-weight:400; margin:1px 0 9px; }
  .badges { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px; }
  .bg { font-size:11px; font-weight:600; padding:2px 10px; border-radius:999px;
        background:var(--soft); color:var(--faint); }
  .bg.yes { background:var(--teal-soft); color:var(--teal); }
  .cacts { display:flex; gap:6px; }
  .empty { grid-column:1/-1; text-align:center; padding:70px 0; color:var(--muted); }
  .empty .big { font-family:var(--display); font-style:italic; font-size:24px;
                color:var(--faint); margin-bottom:8px; }

  /* ---------- create ---------- */
  .createwrap { max-width:620px; }
  .modes { display:inline-flex; gap:4px; padding:5px; background:#ece4d7;
           border-radius:999px; margin-bottom:22px; }
  .modes button { border:none; background:none; color:var(--muted); min-height:0;
                  padding:9px 22px; border-radius:999px; }
  .modes button:hover { color:var(--ink); background:rgba(255,255,255,.6); }
  .modes button.on { background:var(--surface); color:var(--ink);
                     box-shadow:0 2px 8px -2px rgba(50,42,36,.3); }
  .cpanel { background:var(--surface); border-radius:18px; padding:28px 32px 30px;
            box-shadow:var(--shadow); border:1px solid rgba(23,19,19,.05); }
  .trio { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .drop { border:1.5px dashed rgba(23,19,19,.22); border-radius:14px; padding:44px 20px;
          text-align:center; color:var(--muted); cursor:pointer; font-size:13.5px;
          background:var(--soft); transition:all .15s; }
  .drop:hover { border-color:var(--accent); color:var(--accent);
                background:var(--accent-soft); }
  .drop b { display:block; font-family:var(--display); font-size:19px;
            font-weight:600; margin-bottom:5px; }

  /* ---------- queue ---------- */
  .qbar { display:flex; gap:10px; margin-bottom:18px; align-items:center; }
  .qbar select { width:auto; border-radius:999px; padding:7px 13px; }
  .qbar .sp { flex:1; }
  .qpanel { background:var(--surface); border-radius:18px; overflow:hidden;
            box-shadow:var(--shadow); border:1px solid rgba(23,19,19,.05); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; padding:13px 18px; color:var(--faint); font-weight:600;
       font-size:12px; border-bottom:1px solid var(--line); }
  td { padding:13px 18px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tr.rowlink:hover td { background:var(--soft); }
  .mono { font-family:var(--mono); font-size:12px; font-weight:400; }

  .st { white-space:nowrap; font-size:12.5px; font-weight:600; display:inline-flex;
        align-items:center; gap:7px; padding:3px 12px 3px 9px; border-radius:999px;
        background:var(--soft); color:var(--muted); }
  .st::before { content:""; width:7px; height:7px; border-radius:50%;
                background:var(--muted); }
  .st.success { background:var(--teal-soft); color:var(--teal); }
  .st.success::before { background:var(--teal); }
  .st.failed { background:#f8e7e6; color:var(--err); }
  .st.failed::before { background:var(--err); }
  .st.running { background:#e8edf5; color:var(--info); }
  .st.running::before { background:var(--info); }
  .st.retrying { background:#f5eeda; color:var(--warn); }
  .st.retrying::before { background:var(--warn); }
  .st.pending::before { background:none; border:1.5px solid var(--muted);
                        width:5px; height:5px; }

  /* ---------- modal & toast ---------- */
  #modal { position:fixed; inset:0; background:rgba(30,25,22,.52); display:none;
           align-items:flex-start; justify-content:center; padding:54px 20px;
           overflow:auto; z-index:20; backdrop-filter:blur(4px); }
  #modal .box { background:var(--surface); border-radius:20px; max-width:840px;
                width:100%; padding:34px 40px;
                box-shadow:0 34px 100px -28px rgba(20,16,13,.55); }
  #modal h2 { font-family:var(--display); font-size:27px; font-weight:600; margin:0; }
  #modal h3 { font-family:var(--display); font-size:19px; font-weight:600;
              margin:26px 0 8px; }
  pre { background:var(--soft); border-radius:13px; padding:14px 16px;
        white-space:pre-wrap; word-break:break-word; font:400 12px/1.5 var(--mono);
        max-height:230px; overflow:auto; }
  img.preview { max-width:100%; border-radius:13px; margin-top:14px;
                box-shadow:0 14px 40px -16px rgba(50,42,36,.45); }
  .muted { color:var(--muted); }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spread { justify-content:space-between; }
  #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
           background:var(--dark); color:#fff8ef; padding:12px 28px;
           border-radius:999px; display:none; z-index:30; max-width:76%;
           font-size:13.5px; box-shadow:0 16px 44px -12px rgba(0,0,0,.5); }

  @media (max-width:860px){
    aside { position:static; width:auto; flex-direction:row; align-items:center;
            padding:14px 20px; }
    .brand { padding:0 14px 0 0; } .brand .sub { display:none; }
    nav { flex-direction:row; } .side-foot { display:none; }
    .content { margin-left:0; padding:26px 20px 80px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="wm">Lunelle</div>
    <div class="sub">STUDIO</div>
  </div>
  <nav id="nav">
    <a href="#library" class="on" data-v="library"><span class="k">L</span>款式库</a>
    <a href="#create" data-v="create"><span class="k">C</span>新建款式</a>
    <a href="#queue" data-v="queue"><span class="k">Q</span>生成队列</a>
    <a href="/settings"><span class="k">S</span>设置</a>
  </nav>
  <div class="side-foot" id="sideFoot">—</div>
</aside>

<div class="content">

  <div class="view on" id="view-library">
    <div class="vhead">
      <h1>款式库</h1><span class="n" id="libCount"></span>
      <span class="sp"></span>
      <button class="primary" onclick="go('create')">新建款式</button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="view" id="view-create">
    <div class="vhead"><h1>新建款式</h1></div>
    <p class="vsub">用文字描述想要的设计，或直接上传一张设计图交给模型识别。</p>
    <div class="createwrap">
      <div class="modes">
        <button id="tabDesc" class="on" onclick="switchTab('desc')">从描述创建</button>
        <button id="tabImage" onclick="switchTab('image')">按图识别</button>
      </div>
      <div class="cpanel" id="paneDesc">
        <label style="margin-top:0">款式描述（中英文均可）</label>
        <textarea id="f_desc" placeholder="奶白色杏仁形，珍珠点缀，细金线与法式甲尖，亮面"></textarea>
        <label>名称（可留空，自动生成）</label>
        <input id="f_name" placeholder="Pearl French">
        <div class="trio" style="grid-template-columns:1fr 1fr">
          <div><label>甲型</label><select id="f_shape"><option value="">自动</option>
            <option>almond</option><option>coffin</option><option>square</option>
            <option>tapered-square</option><option>squoval</option><option>oval</option>
            <option>round</option><option>stiletto</option></select></div>
          <div><label>长度</label><select id="f_length"><option value="">自动</option>
            <option>short</option><option>medium</option><option>long</option>
            <option>extra-long</option></select></div>
        </div>
        <label>参考图（可选，作为设计与风格参考）</label>
        <div class="flex">
          <input id="f_ref" type="file" accept="image/png,image/jpeg,image/webp" style="width:auto; padding:8px">
        </div>
        <div class="flex" style="margin-top:20px">
          <button class="primary" onclick="createStyle(true)">创建并出图</button>
          <button class="quiet" onclick="createStyle(false)">仅创建</button>
          <span class="muted" id="createMsg" style="font-size:12.5px"></span>
        </div>
      </div>
      <div class="cpanel" id="paneImage" style="display:none">
        <div class="drop" onclick="$('#imgPick').click()">
          <b>选择设计图</b>
          成品照或款式图均可；识别颜色、元素与甲型后自动建立款式，原图存为参考图
        </div>
        <input id="imgPick" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">
        <p class="muted" id="imgMsg" style="margin:12px 0 0; font-size:12.5px"></p>
      </div>
    </div>
  </div>

  <div class="view" id="view-queue">
    <div class="vhead">
      <h1>生成队列</h1>
      <span class="sp"></span>
      <button class="quiet" onclick="doExport()">导出素材包</button>
    </div>
    <div class="qbar">
      <select id="q_status" onchange="loadTasks()"><option value="">全部状态</option>
        <option>pending</option><option>running</option><option>success</option>
        <option>failed</option><option>retrying</option><option>cancelled</option></select>
      <select id="q_type" onchange="loadTasks()"><option value="">全部类型</option>
        <option>grid</option><option>wearing</option><option>hero</option>
        <option>matrix_cell</option></select>
      <span class="sp"></span>
      <button class="quiet sm" onclick="loadTasks()">刷新</button>
    </div>
    <div class="qpanel">
      <table id="tasksTable"><thead><tr>
        <th>SKU</th><th>类型</th><th>状态</th><th>时间</th><th style="text-align:right"></th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

</div>

<div id="modal" onclick="if(event.target===this)this.style.display='none'">
  <div class="box" id="modalBox"></div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token = () => localStorage.getItem('lunelle_token') || '';
const TYPE_LABEL = {grid:'商品图', wearing:'佩戴图', hero:'上架主图', matrix_cell:'试戴图', repair:'修补'};
const TONE_LABEL = {light:'浅肤', medium:'中肤', tan:'小麦', deep:'深肤'};
const VIEW_LABEL = {p2_open_hands:'双手展开', p3_right_hand:'右手', p4_thumb_visible:'双手拇指', p5_left_hand:'左手'};
const ST_LABEL = {pending:'排队中', running:'生成中', success:'完成', failed:'失败',
                  retrying:'重试中', cancelled:'已取消'};

function toast(msg, ms=3500){ const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }

async function api(path, opts={}) {
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token()) opts.headers['X-Admin-Token'] = token();
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((body && (body.error||body.detail)) || ('HTTP '+res.status));
  return body;
}
async function upload(path, file){
  const fd = new FormData(); fd.append('file', file);
  const headers = token() ? {'X-Admin-Token': token()} : {};
  const res = await fetch(path, {method:'POST', body: fd, headers});
  const body = await res.json().catch(()=>null);
  if (!res.ok) throw new Error((body && (body.error||body.detail)) || ('HTTP '+res.status));
  return body;
}

/* ---------- view routing ---------- */
function go(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#view-' + view).classList.add('on');
  document.querySelectorAll('#nav a[data-v]').forEach(a =>
    a.classList.toggle('on', a.dataset.v === view));
  if (history.replaceState) history.replaceState(null, '', '#' + view);
}
document.querySelectorAll('#nav a[data-v]').forEach(a =>
  a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.v); }));
if (location.hash && document.querySelector('#view-' + location.hash.slice(1)))
  go(location.hash.slice(1));

/* ---------- create ---------- */
function switchTab(which){
  $('#tabDesc').classList.toggle('on', which==='desc');
  $('#tabImage').classList.toggle('on', which==='image');
  $('#paneDesc').style.display = which==='desc' ? '' : 'none';
  $('#paneImage').style.display = which==='image' ? '' : 'none';
}
async function createStyle(alsoGenerate){
  $('#createMsg').textContent = '';
  const body = {
    name: $('#f_name').value.trim() || null,
    description: $('#f_desc').value.trim(),
    shape: $('#f_shape').value || null,
    length: $('#f_length').value || null,
  };
  try {
    const out = await api('/api/styles', {method:'POST', body: JSON.stringify(body)});
    let msg = '已创建 ' + out.style.sku;
    if ($('#f_ref').files.length) {
      await upload(`/api/styles/${out.style.style_id}/reference-image?kind=reference`,
                   $('#f_ref').files[0]);
      msg += '，参考图已上传';
      $('#f_ref').value = '';
    }
    if (alsoGenerate) {
      const gen = await api(`/api/styles/${out.style.style_id}/generate`,
        {method:'POST', body: JSON.stringify({output_types:['grid','wearing']})});
      msg += '，已排队 ' + gen.created.length + ' 个任务';
    }
    toast(msg); refreshAll(); go('library');
  } catch(e){ toast('创建失败：' + e.message, 6000); }
}
$('#imgPick').addEventListener('change', async () => {
  if (!$('#imgPick').files.length) return;
  $('#imgMsg').textContent = '识别中…';
  try {
    const out = await upload('/api/styles/from-image', $('#imgPick').files[0]);
    $('#imgMsg').textContent = '';
    toast(`已识别并创建 ${out.style.name}（${out.style.sku}）`, 5000);
    refreshAll(); go('library');
  } catch(e){
    $('#imgMsg').textContent = '';
    toast('识别失败：' + e.message, 8000);
  }
  $('#imgPick').value = '';
});

/* ---------- library ---------- */
let thumbMap = {};
async function buildThumbs(){
  const out = await api('/api/tasks?status=success&limit=500');
  thumbMap = {};
  const rank = {hero:3, grid:2, wearing:1};
  for (const t of out.tasks){
    const cur = thumbMap[t.style_id];
    if (!cur || (rank[t.output_type]||0) > (rank[cur.output_type]||0))
      thumbMap[t.style_id] = t;
  }
}
async function loadStyles(){
  const [out] = await Promise.all([api('/api/styles'), buildThumbs()]);
  $('#libCount').textContent = out.styles.length ? out.styles.length + ' 款' : '';
  $('#grid').innerHTML = out.styles.map(s => {
    const spec = s.spec || {};
    const thumb = thumbMap[s.style_id];
    return `<div class="card">
      <div class="thumb" ${thumb?`style="cursor:pointer" onclick="showTask('${thumb.task_id}')"`:''}>
        ${thumb ? `<img loading="lazy" src="/api/tasks/${thumb.task_id}/image" alt="${esc(s.name)}">`
                : `<span class="ph">Lunelle</span>`}
      </div>
      <div class="cb">
        <h3>${esc(s.name)}</h3>
        <div class="sku">${esc(s.sku)} · ${esc(spec.shape)} · ${esc(spec.length)}</div>
        <div class="badges">
          <span class="bg ${s.plan_image_path?'yes':''}">款式图</span>
          <span class="bg ${s.reference_image_path?'yes':''}">参考图</span>
          <span class="bg ${s.identity_text?'yes':''}">十甲身份</span>
        </div>
        <div class="cacts">
          <button class="sm quiet" onclick="generateTypes('${s.style_id}',['grid','wearing'])">出图</button>
          <button class="sm quiet" onclick="generateTypes('${s.style_id}',['hero'])">主图</button>
          <button class="sm quiet" onclick="generateMatrix('${s.style_id}')">试戴</button>
          <button class="sm link" onclick="manageStyle('${s.style_id}')">管理</button>
        </div>
      </div></div>`;
  }).join('') || `<div class="empty"><div class="big">尚无款式</div>从「新建款式」开始，用一句描述或一张图。</div>`;
}
async function loadMetrics(){
  const s = await api('/api/stats');
  const t = s.tasks;
  $('#metrics').innerHTML = [
    ['进行中', t.pending + t.running + t.retrying],
    ['已完成', t.success], ['失败', t.failed],
    ['成功率', t.success_rate==null?'—':(t.success_rate*100).toFixed(0)+'%'],
  ].map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('');
  $('#sideFoot').innerHTML = `队列 <b>${t.pending + t.running + t.retrying}</b> · 完成 <b>${t.success}</b>`;
}

/* ---------- style management modal ---------- */
const filePicker = document.createElement('input');
filePicker.type = 'file'; filePicker.accept = 'image/png,image/jpeg,image/webp';
filePicker.style.display = 'none'; document.body.appendChild(filePicker);
function pickUpload(styleId, kind){
  filePicker.onchange = async () => {
    if (!filePicker.files.length) return;
    try {
      await upload(`/api/styles/${styleId}/reference-image?kind=${kind}`, filePicker.files[0]);
      toast(kind === 'plan' ? '款式图已上传' : '参考图已上传');
      manageStyle(styleId); loadStyles();
    } catch(e){ toast('上传失败：' + e.message, 6000); }
    filePicker.value = '';
  };
  filePicker.click();
}
async function identifyStyle(styleId){
  toast('正在逐指识别…', 20000);
  try {
    await api(`/api/styles/${styleId}/identify`, {method:'POST', body:'{}'});
    toast('十甲身份已生成', 5000);
    manageStyle(styleId); loadStyles();
  } catch(e){ toast('识别失败：' + e.message, 8000); }
}
async function manageStyle(styleId){
  try {
    const s = await api('/api/styles/' + styleId);
    const st = s.style, spec = st.spec || {};
    $('#modalBox').innerHTML = `
      <div class="flex spread">
        <h2>${esc(st.name)}</h2>
        <span class="mono muted">${esc(st.sku)}</span>
      </div>
      <p class="muted" style="margin:6px 0 0">${esc(spec.shape)} · ${esc(spec.length)} · ${esc((spec.base_colors||[]).join('、'))}</p>
      <h3>素材</h3>
      <div class="flex">
        <button class="sm quiet" onclick="pickUpload('${styleId}','plan')">${st.plan_image_path?'替换款式图':'上传款式图'}</button>
        <button class="sm quiet" onclick="pickUpload('${styleId}','reference')">${st.reference_image_path?'替换参考图':'上传参考图'}</button>
        <button class="sm quiet" onclick="identifyStyle('${styleId}')">识别十甲身份</button>
      </div>
      <h3>十甲身份</h3>
      <p class="muted" style="font-size:12.5px; margin:0 0 8px">逐指描述设计（nail-01 至 nail-10）；上架主图与自动验收以此为准。</p>
      <textarea id="identityText" style="min-height:200px; font-family:var(--mono); font-size:12px">${esc(st.identity_text || '')}</textarea>
      <div class="flex" style="margin-top:14px">
        <button onclick="saveIdentity('${styleId}')">保存</button>
        <button class="quiet" onclick="$('#modal').style.display='none'">关闭</button>
      </div>`;
    $('#modal').style.display = 'flex';
  } catch(e){ toast(e.message, 5000); }
}
async function saveIdentity(styleId){
  try {
    await api(`/api/styles/${styleId}/identity`,
      {method:'PUT', body: JSON.stringify({identity_text: $('#identityText').value})});
    toast('已保存'); $('#modal').style.display='none'; loadStyles();
  } catch(e){ toast('保存失败：' + e.message, 6000); }
}
async function generateMatrix(styleId){
  if (!confirm('生成试戴矩阵：4 种肤色 × 4 个视角，共 16 张。继续？')) return;
  try {
    const gen = await api(`/api/styles/${styleId}/matrix`,
      {method:'POST', body: JSON.stringify({})});
    toast(`试戴矩阵已排队 ${gen.created.length} 格` +
      (gen.skipped.length ? `，${gen.skipped.length} 格已有成品` : ''));
    loadTasks(); loadMetrics();
  } catch(e){ toast('排队失败：' + e.message, 6000); }
}

async function generateTypes(styleId, types){
  try {
    const gen = await api(`/api/styles/${styleId}/generate`,
      {method:'POST', body: JSON.stringify({output_types: types})});
    toast(`已排队 ${gen.created.length} 个任务` +
      (gen.skipped.length ? `，${gen.skipped.length} 个已有成品未重复生成` : ''));
    loadTasks(); loadMetrics();
  } catch(e){ toast('出图失败：' + e.message, 6000); }
}

/* ---------- queue ---------- */
async function loadTasks(){
  const p = new URLSearchParams();
  if ($('#q_status').value) p.set('status', $('#q_status').value);
  if ($('#q_type').value) p.set('output_type', $('#q_type').value);
  const out = await api('/api/tasks?' + p);
  $('#tasksTable tbody').innerHTML = out.tasks.map(t => `<tr class="rowlink">
    <td class="mono">${esc(t.sku)}</td>
    <td>${esc(TYPE_LABEL[t.output_type]||t.output_type)}${
      t.output_type==='matrix_cell' && t.metadata && t.metadata.tone
        ? ` <span class="mono muted" style="font-size:11px">${esc(TONE_LABEL[t.metadata.tone]||t.metadata.tone)}·${esc(VIEW_LABEL[t.metadata.view]||t.metadata.view)}</span>` : ''}</td>
    <td><span class="st ${esc(t.status)}">${esc(ST_LABEL[t.status]||t.status)}</span>${
      t.error_code?` <span class="mono muted" style="font-size:11px">${esc(t.error_code)}</span>`:''}</td>
    <td class="mono muted">${esc((t.created_at||'').replace('T',' ').replace('Z','').slice(5,16))}</td>
    <td style="text-align:right; white-space:nowrap">
      <button class="sm link" onclick="showTask('${t.task_id}')">${t.status==='success'?'查看':'详情'}</button>
      ${t.status==='failed'||t.status==='cancelled'
        ? `<button class="sm link" onclick="retryTask('${t.task_id}')">重试</button>` : ''}
    </td></tr>`).join('') || '<tr><td colspan="5" class="muted" style="padding:26px 18px">暂无任务</td></tr>';
}
async function reviewTask(id, approved){
  try { await api(`/api/tasks/${id}/review`, {method:'POST', body: JSON.stringify({approved})});
    toast(approved ? '已确认可用' : '已标记不合格'); showTask(id); }
  catch(e){ toast('操作失败：' + e.message, 6000); }
}
async function retryTask(id){
  try { await api(`/api/tasks/${id}/retry`, {method:'POST', body:'{}'}); toast('已重新排队'); loadTasks(); }
  catch(e){ toast('重试失败：' + e.message, 6000); }
}
async function showTask(id){
  try {
    const t = await api('/api/tasks/' + id);
    const ver = t.metadata && t.metadata.version ? t.metadata.version : 1;
    const qa = t.qa ? (t.qa.passed
      ? `<h3>自动检查已通过</h3>
         <div class="flex"><span class="muted" style="font-size:12.5px">如实物不符可</span>
         <button class="sm link" onclick="reviewTask('${t.task_id}',false)">标记不合格</button></div>`
      : `<h3>自动检查发现问题</h3>
         ${t.qa.issues.length?`<pre>${esc(JSON.stringify(t.qa.issues, null, 2))}</pre>`:''}
         <div class="flex">
           <button class="sm quiet" onclick="reviewTask('${t.task_id}',true)">人工判定可用</button>
         </div>`) : '';
    const img = t.status==='success' ? `<img class="preview" src="/api/tasks/${id}/image">` : '';
    const correctForm = t.status==='success' ? `
      <h3>提交修正（将创建 v${ver+1}，锁定本版为底图的局部编辑）</h3>
      <p class="muted" style="font-size:12.5px; margin:0 0 8px">只点名要修的甲位；给全图计数锁（如「哥特蛋白石全图恰好 2 个」）；结尾写明其余甲位完全不动。可附放大参考图。</p>
      <textarea id="correctionText" placeholder="只交换右手第 1、3 槽的图案；太阳纹全图恰好一个；其余九个甲片完全不动。"></textarea>
      <div class="flex" style="margin-top:10px">
        <input id="correctionFile" type="file" accept="image/png,image/jpeg,image/webp" style="width:auto">
        <button class="sm" onclick="correctTask('${t.task_id}')">提交修正</button>
      </div>` : '';
    $('#modalBox').innerHTML = `
      <div class="flex spread">
        <h2>${esc(t.sku)} · ${esc(TYPE_LABEL[t.output_type]||t.output_type)} · v${ver}</h2>
        <span class="st ${esc(t.status)}">${esc(ST_LABEL[t.status]||t.status)}</span>
      </div>
      ${t.metadata && t.metadata.correction_of ? `<p class="mono muted" style="font-size:11.5px; margin:6px 0 0">修正自 ${esc(t.metadata.correction_of)}</p>` : ''}
      ${t.error_message?`<p style="color:var(--err)">${esc(t.error_code)}：${esc(t.error_message)}</p>`:''}
      ${img}
      ${qa}
      ${correctForm}
      <p class="mono muted" style="font-size:11px; margin-top:22px">${esc(t.task_id)} · ${esc(t.model)} · ${esc(t.prompt_version)}</p>`;
    $('#modal').style.display = 'flex';
  } catch(e){ toast(e.message, 5000); }
}
async function correctTask(id){
  const text = $('#correctionText').value.trim();
  if (text.length < 4) { toast('请先写明修正内容'); return; }
  const fd = new FormData();
  fd.append('correction', text);
  if ($('#correctionFile').files.length) fd.append('file', $('#correctionFile').files[0]);
  const headers = token() ? {'X-Admin-Token': token()} : {};
  try {
    const res = await fetch(`/api/tasks/${id}/correct`, {method:'POST', body: fd, headers});
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || body.detail || ('HTTP '+res.status));
    toast(`修正版 v${body.version} 已排队`); $('#modal').style.display='none'; loadTasks();
  } catch(e){ toast('提交失败：' + e.message, 8000); }
}

async function doExport(){
  try {
    const out = await api('/api/export', {method:'POST', body: JSON.stringify({})});
    toast(`已导出 ${out.item_count} 个款式 → ${out.export_dir}`, 8000);
  } catch(e){ toast('导出失败：' + e.message, 6000); }
}

function refreshAll(){ loadStyles(); loadTasks(); loadMetrics(); }
refreshAll();
setInterval(()=>{ loadTasks(); loadMetrics(); }, 5000);
</script>
</body>
</html>
